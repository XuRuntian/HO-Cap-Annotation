device: "cuda"
max_workers: 4
pointcloud:
  # World is the master RGB camera, not the original dataset's table frame.
  # null keeps valid positive depth without a spatial crop.
  crop_limits: null
sam2:
  model_checkpoint: "${oc.env:HOME}/models/sam2.1/sam2.1_hiera_large.pt"
  model_config: "config/sam2_config/sam2.1_hiera_l.yaml"
mano:
  model_path: "${oc.env:HOME}/models/mano"
  use_pca: true
  flat_hand_mean: false
  num_pca_comps: 45
mp_hand:
  max_num_hands: 2
  min_hand_detection_confidence: 0.1
  min_tracking_confidence: 0.5
  min_hand_presence_confidence: 0.5
  running_mode: "video"
  frame_rate: 30
  model_asset_path: "config/checkpoints/mediapipe/hand_landmarker.task"
  device: cpu
camera_serials:
  rs_serials:
    - "246322300746"
    - "338522300613"
    - "338522302174"
    - "341222301246"
    - "342622301386"
    - "342622302051"
  rs_master: "338522300613"
  hl_serial: no_hololens
optimization:
  hand_pose_solver:
    lr: 0.001
    total_steps: 10000
    sdf_steps: 100
    smooth_steps: 500
    w_sdf: 1.0
    w_kpt_2d: 1.0
    w_kpt_3d: 1.0
    w_reg: 0.001
    w_smooth: 0.1
    w_smooth_rot: 0.0
    w_smooth_trans: 0.0
    w_smooth_acc_rot: 1.0
    w_smooth_acc_trans: 1.0
    smooth_window_size: 1
    # Initialization only: require >=2-view hand support throughout a short gap.
    # Longer/unsupported gaps remain invalid and do not enter temporal smoothing.
    max_init_gap_frames: 5
    sdf_dist_thresh: 0.01
    load_offline_dpts: false
    valid_rs_serials:
      - "246322300746"
      - "338522300613"
      - "338522302174"
      - "341222301246"
      - "342622301386"
      - "342622302051"
    valid_mano_joint_indices:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 6
      - 8
      - 10
      - 12
      - 14
      - 16
      - 18
      - 20
  object_pose_solver:
    lr: 0.001
    total_steps: 50
    sdf_steps: 50
    smooth_steps: 50
    w_sdf: 1.0
    w_reg: 1.0
    w_smooth: 0.01
    w_smooth_rot: 0.1
    w_smooth_trans: 1.0
    w_smooth_acc_rot: 1.0
    w_smooth_acc_trans: 0.1
    smooth_window_size: 3
    sdf_dist_thresh: 0.01
    use_object_masks: false
    load_offline_dpts: false
  joint_pose_solver:
    lr: 0.001
    total_steps: 50
    sdf_steps: 50
    w_sdf: 10.0
    w_reg_m: 1.0
    w_reg_o: 1.0
    w_smooth_m: 0.01
    w_smooth_rot_m: 0.0
    w_smooth_trans_m: 0.0
    w_smooth_acc_rot_m: 1.0
    w_smooth_acc_trans_m: 1.0
    smooth_window_size_m: 1
    w_smooth_o: 0.01
    w_smooth_rot_o: 0.1
    w_smooth_trans_o: 1.0
    w_smooth_acc_rot_o: 1.0
    w_smooth_acc_trans_o: 0.1
    smooth_window_size_o: 3
    sdf_dist_thresh: 0.01
    load_offline_dpts: false
