# 真人手部外部尺寸（参考 NIOSH Figure 1）。左右手分别填写，单位为毫米。
# 参考图：https://stacks.cdc.gov/view/cdc/36887/cdc_36887_DS1.pdf#page=16
# 按图量摊开手掌的投影尺寸，不要沿皮肤曲面绕量；指尖不算指甲。
# 只填有把握的数值，未测留 null。完全不填时不修正。
# 图中 2 号手宽与 4 号掌宽不是同一项；五指宽都在从指根数的第一道关节处量。
# 整手长 = 掌长 + 中指长。三项都填时，整手长只用作报告对照。
definition: niosh_external_v1
units: mm

right:  # 右手
  hand_length: null    # 图中 1 号：沿手的纵轴，从腕横纹到中指尖
  hand_breadth: null    # 图中 2 号：食指根外侧掌缘到小指根外侧掌缘，不含拇指
  palm_length: null     # 图中 3 号：腕横纹到中指根部掌侧横纹
  palm_breadth: null    # 图中 4 号：远侧掌横纹的一侧端点到近侧掌横纹的另一侧端点
  thumb_length: null   # 图中 5 号：拇指根部到拇指尖
  thumb_breadth: null  # 图中 6 号：拇指第一道关节位置的横向宽度
  index_length: null   # 图中 7 号：食指根部到食指尖
  index_breadth: null  # 图中 8 号：食指第一道关节位置的横向宽度
  middle_length: null  # 图中 9 号：中指根部到中指尖
  middle_breadth: null # 图中 10 号：中指第一道关节位置的横向宽度
  ring_length: null    # 图中 11 号：无名指根部到无名指尖
  ring_breadth: null   # 图中 12 号：无名指第一道关节位置的横向宽度
  little_length: null  # 图中 13 号：小指根部到小指尖
  little_breadth: null # 图中 14 号：小指第一道关节位置的横向宽度

left:  # 左手
  hand_length: null    # 图中 1 号：沿手的纵轴，从腕横纹到中指尖
  hand_breadth: null    # 图中 2 号：食指根外侧掌缘到小指根外侧掌缘，不含拇指
  palm_length: null     # 图中 3 号：腕横纹到中指根部掌侧横纹
  palm_breadth: null    # 图中 4 号：远侧掌横纹的一侧端点到近侧掌横纹的另一侧端点
  thumb_length: null   # 图中 5 号：拇指根部到拇指尖
  thumb_breadth: null  # 图中 6 号：拇指第一道关节位置的横向宽度
  index_length: null   # 图中 7 号：食指根部到食指尖
  index_breadth: null  # 图中 8 号：食指第一道关节位置的横向宽度
  middle_length: null  # 图中 9 号：中指根部到中指尖
  middle_breadth: null # 图中 10 号：中指第一道关节位置的横向宽度
  ring_length: null    # 图中 11 号：无名指根部到无名指尖
  ring_breadth: null   # 图中 12 号：无名指第一道关节位置的横向宽度
  little_length: null  # 图中 13 号：小指根部到小指尖
  little_breadth: null # 图中 14 号：小指第一道关节位置的横向宽度
